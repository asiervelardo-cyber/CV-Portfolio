# Nombre de la aplicación.
spring.application.name=CV-Portfolio

# Puerto: en Vercel usa el que le den (PORT) y en mi ordenador el 8080.
server.port=${PORT:8080}

# Así los cambios en las plantillas se ven sin reiniciar.
spring.thymeleaf.cache=false

# Si falta un idioma, usa messages.properties (español) en vez del idioma del ordenador.
spring.messages.fallback-to-system-locale=false

# Hito 1: el nombre que sale en el currículum. Si lo cambio y reinicio, cambia en la página.
cv.nombre= Asier

# Hito 3: número máximo de proyectos en el editor.
portfolio.max-proyectos=5

